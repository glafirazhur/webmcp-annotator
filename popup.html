<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebMCP Annotator</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="container" aria-label="WebMCP Annotator popup">
    <div class="header">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 7v5"></path>
          <circle cx="12" cy="16.5" r="0.8" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="header-text">
        <h1>WebMCP AI Annotator</h1>
        <p>Browser extension for WebMCP tool registration.</p>
      </div>
    </div>

    <div class="divider"></div>

    <section class="webmcp-panel" aria-label="Settings">
      <div class="section-title">Settings</div>

      <div class="form-group">
        <label class="webmcp-label" for="settings-api-key">Google AI Studio API Key</label>
        <div class="password-container">
          <input type="password" id="settings-api-key" class="webmcp-input" placeholder="Paste your API key"
            autocomplete="off" spellcheck="false" aria-describedby="api-key-help" />
          <button type="button" id="toggle-key" class="btn-icon" aria-label="Show or hide API key">
            <span aria-hidden="true">Show</span>
          </button>
        </div>
        <p id="api-key-help" class="webmcp-help">
          Your API key is stored locally in your browser profile.
        </p>
      </div>

      <div class="form-group">
        <label class="webmcp-label" for="settings-model">Model</label>
        <select id="settings-model" class="webmcp-select">
          <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
          <option value="gemini-3.1-flash-light">Gemini 3.1 Flash Light</option>
          <option value="gemma-4-31b-it">Gemma 4 31B IT</option>
        </select>
      </div>

      <button id="btn-save-settings" class="webmcp-btn webmcp-btn-success" type="button">
        Save Settings
      </button>
    </section>

    <div id="status" class="status-box" role="status" aria-live="polite" aria-atomic="true">
      <span class="status-text"></span>
      <button id="status-close" class="status-close-btn" type="button" aria-label="Close">
        &times;
      </button>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>

</html>
