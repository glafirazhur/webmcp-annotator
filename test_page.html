<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock E-Commerce Store (WebMCP Annotation Test)</title>
  <link rel="stylesheet" href="test_page.css">
</head>
<body>

  <header class="header">
    <h1>SuperGadget Store</h1>
    <div class="search-box">
      <form action="/search" method="GET" role="search" aria-label="Product search">
        <div class="search-row">
          <input type="search" name="q" placeholder="Search gadgets..." autocomplete="off" required>
          <button type="submit" class="search-submit">Search</button>
        </div>
      </form>
    </div>
  </header>

  <main>
  <section class="product-card" aria-labelledby="product-1-name">
    <h2 id="product-1-name">Product 1: Ultimate Wireless Headphones</h2>
    <p>Premium noise-canceling headphones with 40-hour battery life.</p>
    
    <form action="/cart/add" method="POST" class="product-form-standard">
      <div class="form-group">
        <label for="variant-select">Choose Color / Model</label>
        <select name="id" id="variant-select">
          <option value="9912">Matte Black - $299.99</option>
          <option value="9913">Silver Platinum - $299.99</option>
          <option value="9914">Midnight Blue - $319.99</option>
        </select>
      </div>

      <div class="form-group">
        <label for="quantity-select">Quantity</label>
        <input type="number" name="quantity" id="quantity-select" value="1" min="1" max="10">
      </div>

      <input type="submit" value="Add to Bag">
    </form>
  </section>
  </main>
</body>
</html>
